name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  # ---------------------------------------------------------------------------
  # Build the library and run the full test suite under ASan + UBSan.
  # ---------------------------------------------------------------------------
  test:
    name: "Test"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install ninja
        run: sudo apt-get update -q && sudo apt-get install -y ninja-build

      - name: Install meson
        run: pip install meson

      - name: Configure
        run: >
          meson setup build
          --buildtype=debug
          -Dbuild_tests=true
          -Db_sanitize=address,undefined

      - name: Build
        run: meson compile -C build

      - name: Test
        run: meson test -C build --verbose --print-errorlogs

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testlog
          path: build/meson-logs/testlog.txt

  # ---------------------------------------------------------------------------
  # Release build: the configuration a downstream project would use. No
  # sanitizers, no tests; just verify the library compiles cleanly.
  # ---------------------------------------------------------------------------
  release-build:
    name: "Release"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install ninja
        run: sudo apt-get update -q && sudo apt-get install -y ninja-build

      - name: Install meson
        run: pip install meson

      - name: Configure
        run: >
          meson setup build
          --buildtype=release
          -Dbuild_tests=false

      - name: Build
        run: meson compile -C build

  # ---------------------------------------------------------------------------
  # Warnings-as-errors build. Catches new warnings introduced by a PR
  # before they become technical debt.
  # ---------------------------------------------------------------------------
  werror:
    name: "Warnings as errors"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install ninja
        run: sudo apt-get update -q && sudo apt-get install -y ninja-build

      - name: Install meson
        run: pip install meson

      - name: Configure (debug + tests + werror)
        run: >
          meson setup build_warn
          --buildtype=debug
          -Dbuild_tests=true
          -Dwerror=true

      - name: Build
        run: meson compile -C build_warn

  # ---------------------------------------------------------------------------
  # Static analysis with cppcheck. Runs against the source and the public
  # headers; fails on any warning/style/performance/portability finding
  # not silenced by an inline `cppcheck-suppress` comment.
  # ---------------------------------------------------------------------------
  cppcheck:
    name: "Static analysis (cppcheck)"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update -q && sudo apt-get install -y cppcheck

      # cppcheck needs to see the fxp headers since they appear in fpc's
      # public API. Fetch the wrap so the include path resolves.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install meson + ninja
        run: |
          sudo apt-get install -y ninja-build
          pip install meson

      - name: Resolve subproject wraps
        run: meson subprojects download fxp

      - name: Run cppcheck
        run: >
          cppcheck
          --enable=warning,style,performance,portability
          --error-exitcode=1
          --inline-suppr
          --std=c11
          --suppress=missingIncludeSystem
          --suppress=unusedFunction
          --suppress=*:subprojects/*
          -I include
          -I subprojects/fxp/include
          src/ include/

  # ---------------------------------------------------------------------------
  # Memory-error gate with Valgrind. Runs the test suite under
  # `memcheck` without compiler sanitizers (ASan and Valgrind are
  # incompatible). Any leak, invalid read/write, or uninitialised use
  # fails the job.
  # ---------------------------------------------------------------------------
  valgrind:
    name: "Memory check (Valgrind)"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install ninja and valgrind
        run: sudo apt-get update -q && sudo apt-get install -y ninja-build valgrind

      - name: Install meson
        run: pip install meson

      - name: Configure (debug, no sanitizers)
        run: >
          meson setup build
          --buildtype=debug
          -Dbuild_tests=true

      - name: Build
        run: meson compile -C build

      - name: Test under Valgrind
        run: >
          meson test -C build --verbose
          --wrapper='valgrind --error-exitcode=1 --leak-check=full
          --show-leak-kinds=all --track-origins=yes --errors-for-leak-kinds=all'

      - name: Upload Valgrind log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-log
          path: build/meson-logs/testlog.txt

  # ---------------------------------------------------------------------------
  # Code coverage gate. Builds with gcov instrumentation, runs the full
  # test suite, and fails the job if line or branch coverage drops below
  # the threshold.
  # ---------------------------------------------------------------------------
  coverage:
    name: "Coverage gate"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install ninja
        run: sudo apt-get update -q && sudo apt-get install -y ninja-build

      - name: Install meson and gcovr
        run: pip install meson gcovr

      - name: Configure (coverage)
        run: >
          meson setup build
          --buildtype=debug
          -Dbuild_tests=true
          -Db_coverage=true

      - name: Build
        run: meson compile -C build

      - name: Run tests
        run: meson test -C build --verbose

      - name: Generate coverage report
        run: |
          mkdir -p coverage-report
          gcovr \
            --root . \
            --filter 'src/' \
            --filter 'include/' \
            --html-details coverage-report/index.html \
            --txt coverage-report/summary.txt \
            --print-summary \
            --fail-under-line 100 \
            --fail-under-branch 100

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/

  # ---------------------------------------------------------------------------
  # Cross-compile the library and its fxp dependency with TI's C2000 code
  # generation tools, a target with CHAR_BIT == 16 and a 16-bit int, under
  # both object ABIs. The installer is checksum-pinned and the installed
  # toolchain is cached.
  # ---------------------------------------------------------------------------
  c2000:
    name: "TI C2000 (CGT ${{ matrix.cgt }})"
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - cgt: "22.6.2"
            sha256: "9773f338df7b7314bc459be2cd9d9bf329786da8de6531f8f2d3d38c1e9f5750"
          - cgt: "25.11.1"
            sha256: "2f3a978e24a53279c9796ad374c32b530fc58fd085fd71288597846fe169c821"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Meson and Ninja
        run: python -m pip install --upgrade meson ninja

      - name: Cache TI C2000 CGT
        id: cache-cgt
        uses: actions/cache@v4
        with:
          path: ~/ti
          key: ti-cgt-c2000-${{ matrix.cgt }}

      - name: Install TI C2000 CGT
        if: steps.cache-cgt.outputs.cache-hit != 'true'
        run: |
          bin="ti_cgt_c2000_${{ matrix.cgt }}.LTS_linux-x64_installer.bin"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/$bin" \
            "https://dr-download.ti.com/software-development/ide-configuration-compiler-or-debugger/MD-xqxJ05PLfM/${{ matrix.cgt }}.LTS/$bin"
          echo "${{ matrix.sha256 }}  $RUNNER_TEMP/$bin" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/$bin"
          "$RUNNER_TEMP/$bin" --mode unattended --prefix "$HOME/ti"

      - name: Configure and build (COFF and EABI)
        run: |
          CGT="$HOME/ti/ti-cgt-c2000_${{ matrix.cgt }}.LTS"
          for abi in coffabi eabi; do
            cat > "c2000-$abi.ini" <<INI
          [binaries]
          c = '$CGT/bin/cl2000'
          ar = '$CGT/bin/ar2000'
          strip = '$CGT/bin/strip2000'

          [built-in options]
          c_args = ['-v28', '--float_support=fpu32', '--abi=$abi', '-I$CGT/include']

          [host_machine]
          system = 'bare-metal'
          cpu_family = 'c2000'
          cpu = 'c28x'
          endian = 'little'
          INI
            meson setup "build-$abi" --cross-file="c2000-$abi.ini" \
              -Dbuild_tests=false -Dwerror=true
            meson compile -C "build-$abi"
          done
